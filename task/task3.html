<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Message Board</title>
    <link rel="stylesheet" href="task3.css">
</head>

<body>

    <div class="container">

        <h1>✨ Creative Message Board ✨</h1>

        <input
            type="text"
            id="messageInput"
            placeholder="💬 Type your message..."
        >

        <div class="buttons">
            <button id="addBtn">➕ Add Message</button>
            <button id="clearBtn">🗑 Clear All</button>
        </div>

        <p id="count">Characters : 0</p>

        <p id="status"></p>

        <div id="messages"></div>

    </div>

    <script src="task3.js"></script>

</body>

</html>
